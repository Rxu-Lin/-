<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>简繁校对工具 - 图片简体批注版</title>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;background:#f0f2f5;padding:30px 20px}
.box{max-width:860px;margin:auto;background:#fff;border-radius:16px;padding:35px;box-shadow:0 5px 30px rgba(0,0,0,0.08)}
h1{font-size:24px;color:#1a1a2e;margin-bottom:5px}
h1 small{font-size:12px;background:#2649B2;color:#fff;padding:2px 10px;border-radius:12px;vertical-align:middle;margin-left:8px}
.sub{color:#888;font-size:14px;margin-bottom:25px;padding-bottom:12px;border-bottom:1px solid #eee}
.upzone{border:2px dashed #ccc;border-radius:14px;padding:60px 20px;text-align:center;cursor:pointer;background:#fafbff;position:relative}
.upzone:hover{border-color:#2649B2;background:#f0f4ff}
.upzone .ico{font-size:48px}
.upzone input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer}
.pre{display:none;margin-top:20px}
.pre.show{display:block}
.img-wrap{position:relative;display:inline-block;width:100%}
.img-wrap img{max-width:100%;max-height:400px;border-radius:10px;border:1px solid #e0e0e0;display:block;margin:0 auto}
#overlay{position:absolute;top:0;left:0;border-radius:10px}
.btns{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
.btn{padding:11px 26px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.btn-g{background:#059669;color:#fff}
.btn-g:hover{background:#047857}
.btn-g:disabled{background:#aaa;cursor:default}
.btn-gr{background:#e5e7eb;color:#333}
.btn-gr:hover{background:#d1d5db}
.st{display:none;margin-top:12px;padding:10px 14px;border-radius:8px;font-size:14px}
.st.show{display:block}
.st-l{background:#fef3c7;color:#92400e}
.st-o{background:#d1fae5;color:#065f46}
.st-e{background:#fee2e2;color:#991b1b}
.res{display:none;margin-top:25px;border-top:1px solid #eee;padding-top:20px}
.res.show{display:block}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.card{background:#f9fafb;border-radius:10px;padding:14px;text-align:center;border:1px solid #eee}
.card .n{font-size:28px;font-weight:700;color:#2649B2}
.card .n.red{color:#dc2626}
.card .n.green{color:#059669}
.card .l{font-size:12px;color:#888;margin-top:3px}
.eb{background:#fff8f8;border:1px solid #fecaca;border-radius:10px;padding:16px;margin:12px 0}
.eb h3{color:#991b1b;font-size:15px;margin-bottom:10px}
.er{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#fff;border-radius:6px;margin-bottom:6px;border:1px solid #fee2e2;cursor:pointer}
.er:hover{background:#fef2f2}
.er .s{background:#fee2e2;color:#991b1b;padding:2px 10px;border-radius:4px;font-weight:700;font-size:18px;min-width:30px;text-align:center}
.er .t{background:#d1fae5;color:#065f46;padding:2px 10px;border-radius:4px;font-weight:700;font-size:18px;min-width:30px;text-align:center}
.er .c{color:#888;font-size:13px;margin-left:auto}
.okmsg{text-align:center;padding:30px;color:#065f46;font-size:16px}
.okmsg .bi{font-size:48px;display:block;margin-bottom:8px}
.obox{background:#f9fafb;border-radius:10px;padding:14px;margin-top:15px;border:1px solid #e0e0e0}
.obox h4{font-size:13px;color:#888;margin-bottom:6px}
.ocr{font-size:15px;line-height:1.8;white-space:pre-wrap;word-break:break-all}
.ocr .hl{background:#fecaca;color:#991b1b;padding:1px 4px;border-radius:3px;font-weight:600;cursor:pointer}
.leg{display:flex;gap:16px;margin-top:8px;font-size:12px;color:#888;flex-wrap:wrap}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px}
.leg .r{background:#fecaca}
.leg .g{background:#d1fae5}
.ft{text-align:center;margin-top:20px;font-size:12px;color:#bbb}
@media(max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="box">
<h1>📝 简繁校对工具 <small>BETA v2</small></h1>
<p class="sub">上传图片 → 检测简体字 → 在图片上批注建议的繁体字</p>

<div class="upzone" id="upzone">
    <div class="ico">🖼</div>
    <div><b>点击上传</b> 或拖拽图片</div>
    <div style="font-size:13px;color:#999;margin-top:6px;">JPG / PNG / WebP</div>
    <input type="file" id="fi" accept="image/*">
</div>

<div class="pre" id="pre">
    <div class="img-wrap" id="imgWrap">
        <img id="img">
        <canvas id="overlay"></canvas>
    </div>
    <div class="btns">
        <button class="btn btn-g" id="goBtn">🚀 开始检查</button>
        <button class="btn btn-gr" id="reBtn">🔄 重新选择</button>
    </div>
    <div class="st" id="st"></div>
</div>

<div id="tooltip" style="display:none;position:fixed;background:#1a1a2e;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:999;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,0.25);max-width:300px;line-height:1.5;"></div>

<div class="res" id="res">
    <div class="cards" id="cards"></div>
    <div id="ea"></div>
    <div class="obox">
        <h4>📄 OCR 结果（<span style="background:#fecaca;padding:0 4px;">红底</span> = 简体字，建议改为下方繁体）</h4>
        <div class="ocr" id="ocr"></div>
        <div class="leg"><span><i class="r"></i>简体字</span><span><i class="g"></i>建议繁体</span></div>
    </div>
</div>
<div class="ft">本地浏览器处理 ✅ | 字典覆盖 2000+ 简体字</div>
</div>

            combined[k] = dict[k];
        });
    });

    return combined;
})();

// ============================================================
// ★ UI 逻辑
// ============================================================
const upzone = document.getElementById('upzone');
const fi = document.getElementById('fi');
const pre = document.getElementById('pre');
const img = document.getElementById('img');
const goBtn = document.getElementById('goBtn');
const reBtn = document.getElementById('reBtn');
const st = document.getElementById('st');
const res = document.getElementById('res');
const cards = document.getElementById('cards');
const ea = document.getElementById('ea');
const ocr = document.getElementById('ocr');
const overlay = document.getElementById('overlay');
const tooltip = document.getElementById('tooltip');

let file = null, busy = false, boxes = [];

// ===== 上传 =====
upzone.onclick = () => fi.click();
fi.onchange = e => { if (e.target.files[0]) load(e.target.files[0]); };
upzone.ondragover = e => { e.preventDefault(); upzone.style.borderColor = '#2649B2'; };
upzone.ondragleave = () => { upzone.style.borderColor = '#ccc'; };
upzone.ondrop = e => {
    e.preventDefault();
    upzone.style.borderColor = '#ccc';
    if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);
};

function load(f) {
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(f.type)) {
        s('e', '不支持的文件格式，请上传 JPG/PNG/WebP');
        return;
    }
    file = f;
    const r = new FileReader();
    r.onload = e => {
        img.src = e.target.result;
        img.onload = () => { fitOverlay(); };
        pre.classList.add('show');
        res.classList.remove('show');
        h();
        goBtn.disabled = false;
        clearCanvas();
        boxes = [];
    };
    r.readAsDataURL(f);
}

reBtn.onclick = () => {
    fi.value = '';
    file = null;
    pre.classList.remove('show');
    res.classList.remove('show');
    h();
    clearCanvas();
    boxes = [];
};

function fitOverlay() {
    overlay.width = img.clientWidth;
    overlay.height = img.clientHeight;
    overlay.style.width = img.clientWidth + 'px';
    overlay.style.height = img.clientHeight + 'px';
    if (boxes.length > 0) drawBoxes();
}
window.addEventListener('resize', () => { if (pre.classList.contains('show')) fitOverlay(); });

function clearCanvas() {
    const ctx = overlay.getContext('2d');
    ctx.clearRect(0, 0, overlay.width, overlay.height);
}

// ===== ★ 绘图：红框标简体 + 绿底批注繁体 =====
function drawBoxes() {
    const ctx = overlay.getContext('2d');
    const W = overlay.width, H = overlay.height;
    ctx.clearRect(0, 0, W, H);
    if (boxes.length === 0) return;
    const nw = img.naturalWidth || W, nh = img.naturalHeight || H;
    const sx = W / nw, sy = H / nh;

    boxes.forEach(b => {
        const x = b.x * sx, y = b.y * sy, w = b.w * sx, h = b.h * sy;
        b.dx = x; b.dy = y; b.dw = w; b.dh = h;

        // 红色半透明底 + 红框
        ctx.fillStyle = 'rgba(220,38,38,0.15)';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = 'rgba(220,38,38,0.7)';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);

        // 绿色标签批注建议的繁体字
        const label = b.tr;
        ctx.font = 'bold 15px sans-serif';
        const tw = ctx.measureText(label).width + 14;
        let tx = x + (w - tw) / 2;
        let ty = y - 26;
        if (ty < 0) ty = y + h + 2;

        ctx.fillStyle = 'rgba(5,150,105,0.9)';
        const r = 5;
        ctx.beginPath();
        ctx.moveTo(tx + r, ty);
        ctx.lineTo(tx + tw - r, ty);
        ctx.quadraticCurveTo(tx + tw, ty, tx + tw, ty + r);
        ctx.lineTo(tx + tw, ty + 24 - r);
        ctx.quadraticCurveTo(tx + tw, ty + 24, tx + tw - r, ty + 24);
        ctx.lineTo(tx + r, ty + 24);
        ctx.quadraticCurveTo(tx, ty + 24, tx, ty + 24 - r);
        ctx.lineTo(tx, ty + r);
        ctx.quadraticCurveTo(tx, ty, tx + r, ty);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText(label, tx + 7, ty + 17);
    });
}

// ===== ★ 开始检查（优化版） =====
goBtn.onclick = async () => {
    if (!file) { s('e', '请先上传图片'); return; }
    if (busy) return;
    busy = true;
    goBtn.disabled = true;
    res.classList.remove('show');
    clearCanvas();
    boxes = [];
    s('l', '🔄 加载 OCR 引擎中...');

    try {
        if (typeof Tesseract === 'undefined') {
            await new Promise(r => setTimeout(r, 3000));
            if (typeof Tesseract === 'undefined') {
                s('e', 'OCR 引擎加载失败，请刷新页面重试');
                busy = false;
                goBtn.disabled = false;
                return;
            }
        }

        s('l', '⏳ 正在识别图片文字中...');

        // ★ 优化：使用 chi_sim+chi_tra 混合，采用更好的 PSM 模式
        const worker = await Tesseract.createWorker('chi_sim+chi_tra', 1, {
            logger: m => {
                if (m.status === 'recognizing text') {
                    s('l', '⏳ 识别中... ' + Math.round(m.progress * 100) + '%');
                }
            }
        });

        await worker.setParameters({
            // PSM 6 = 假设为统一文本块，适合大多数图片
            tessedit_pageseg_mode: '6',
            // OEM 1 = LSTM 引擎（更准确）
            tessedit_ocr_engine_mode: '1',
            // 提高中文识别准确度
            textord_heavy_nr: '1',
            // 启用字符置信度
            tessedit_enable_dict_correction: '1',
        });

        const { data } = await worker.recognize(file);
        await worker.terminate();

        const text = data.text.trim();
        if (!text) {
            s('e', '未识别到文字，请尝试更清晰的图片');
            busy = false;
            goBtn.disabled = false;
            return;
        }

        s('l', '🔍 分析简体字...');

        // ★ 优化：更精确的字级位置映射
        const map = new Map();
        let ocrHtml = '';
        const newBoxes = [];

        // Step 1: 从 words 中提取每个字符的位置
        for (const word of (data.words || [])) {
            const wtext = word.text;
            const bb = word.bbox;
            const cw = (bb.x1 - bb.x0) / Math.max(wtext.length, 1);
            const ch = (bb.y1 - bb.y0);

            for (let ci = 0; ci < wtext.length; ci++) {
                const c = wtext[ci];
                // 跳过空白字符
                if (c === ' ' || c === '\n' || c === '\t') continue;

                const t = SIMP_TO_TRAD[c];
                if (t && t !== c) {
                    map.set(c, (map.get(c) || 0) + 1);
                    const x0 = bb.x0 + cw * ci;
                    const x1 = x0 + cw;
                    newBoxes.push({
                        s: c,
                        tr: t,
                        x: x0,
                        y: bb.y0,
                        w: Math.max(x1 - x0, 6),
                        h: Math.max(ch, 6),
                        used: false
                    });
                }
            }
        }

        boxes = newBoxes;

        // Step 2: 构建 OCR 结果 HTML（高亮简体字）
        const boxMap = new Map();
        for (let j = 0; j < boxes.length; j++) {
            if (!boxMap.has(boxes[j].s)) boxMap.set(boxes[j].s, []);
            boxMap.get(boxes[j].s).push(j);
        }
        const nextIdx = {};

        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            const t = SIMP_TO_TRAD[c];
            if (t && t !== c) {
                if (!nextIdx[c]) nextIdx[c] = 0;
                const list = boxMap.get(c) || [];
                const idx = list[nextIdx[c]++];
                ocrHtml += `<span class="hl" data-i="${idx !== undefined ? idx : ''}">${c}</span>`;
            } else {
                ocrHtml += c;
            }
        }

        // Step 3: 统计卡片
        const total = text.replace(/\s/g, '').length;
        const sc = [...map.values()].reduce((a, b) => a + b, 0);
        const arr = [...map.entries()].sort((a, b) => b[1] - a[1]);

        cards.innerHTML = `
            <div class="card"><div class="n">${total}</div><div class="l">总字数</div></div>
            <div class="card"><div class="n ${sc ? 'red' : 'green'}">${sc}</div><div class="l">简体字数量</div></div>
            <div class="card"><div class="n">${arr.length}</div><div class="l">不同简体字</div></div>
            <div class="card"><div class="n ${sc ? 'red' : 'green'}">${total ? ((sc / total) * 100).toFixed(1) : '0'}%</div><div class="l">简体占比</div></div>
        `;

        if (arr.length === 0) {
            ea.innerHTML = '<div class="okmsg"><span class="bi">✅</span><p>全部是繁体字，无需修改！</p></div>';
        } else {
            let eh = '<div class="eb"><h3>⚠ 发现 ' + sc + ' 个简体字（点击可高亮对应位置）：</h3>';
            arr.forEach(a => {
                eh += '<div class="er" data-s="' + a[0] + '"><span class="s">' + a[0] + '</span> → <span class="t">' + SIMP_TO_TRAD[a[0]] + '</span><span class="c">' + a[1] + ' 次</span></div>';
            });
            eh += '</div>';
            ea.innerHTML = eh;
            document.querySelectorAll('.er').forEach(el => {
                el.onclick = function () { highlightOnCanvas(this.dataset.s); };
            });
        }

        ocr.innerHTML = ocrHtml;

        // Step 4: 图片标注 + 交互
        if (boxes.length > 0) {
            fitOverlay();
            drawBoxes();

            overlay.onmousemove = function (e) {
                const rect = overlay.getBoundingClientRect();
                const mx = e.clientX - rect.left, my = e.clientY - rect.top;
                let found = null;
                for (let i = boxes.length - 1; i >= 0; i--) {
                    const b = boxes[i];
                    if (mx >= b.dx && mx <= b.dx + b.dw && my >= b.dy && my <= b.dy + b.dh) {
                        found = b;
                        break;
                    }
                }
                if (found) {
                    tooltip.innerHTML = '<div style="color:#fca5a5;font-size:12px;">⚠ 此处为简体字</div>' +
                        '<div style="display:flex;align-items:center;gap:8px;margin-top:4px;">' +
                        '<span style="background:#fee2e2;color:#dc2626;padding:2px 10px;border-radius:4px;font-weight:700;font-size:20px;">' + found.s + '</span>' +
                        '<span style="color:#888;">→ 建议改为 →</span>' +
                        '<span style="background:#d1fae5;color:#059669;padding:2px 10px;border-radius:4px;font-weight:700;font-size:20px;">' + found.tr + '</span></div>';
                    tooltip.style.display = 'block';
                    tooltip.style.left = (e.clientX + 14) + 'px';
                    tooltip.style.top = (e.clientY - 12) + 'px';
                    const tr = tooltip.getBoundingClientRect();
                    if (tr.right > window.innerWidth) tooltip.style.left = (e.clientX - tr.width - 14) + 'px';
                    if (tr.top < 0) tooltip.style.top = (e.clientY + 20) + 'px';
                    overlay.style.cursor = 'pointer';
                } else {
                    tooltip.style.display = 'none';
                    overlay.style.cursor = 'default';
                }
            };
            overlay.onmouseleave = () => { tooltip.style.display = 'none'; };

            document.querySelectorAll('.ocr .hl').forEach(el => {
                el.onmouseenter = function () {
                    const idx = parseInt(this.dataset.i);
                    if (idx >= 0 && idx < boxes.length) highlightSingle(idx);
                };
                el.onmouseleave = () => drawBoxes();
            });
        }

        s('o', arr.length ? '✅ 发现 ' + sc + ' 个简体字，已在图片上标注繁体建议' : '✅ 全部是繁体字！');
        res.classList.add('show');

    } catch (e) {
        console.error(e);
        s('e', '处理失败：' + e.message);
    }
    busy = false;
    goBtn.disabled = false;
};

// ===== ★ 高亮单个字 =====
function highlightSingle(idx) {
    const ctx = overlay.getContext('2d');
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    boxes.forEach((b, i) => {
        const is = i === idx;
        ctx.fillStyle = is ? 'rgba(239,68,68,0.35)' : 'rgba(220,38,38,0.10)';
        ctx.fillRect(b.dx, b.dy, b.dw, b.dh);
        ctx.strokeStyle = is ? 'rgba(239,68,68,1)' : 'rgba(220,38,38,0.3)';
        ctx.lineWidth = is ? 3 : 1;
        ctx.strokeRect(b.dx, b.dy, b.dw, b.dh);
        const label = b.tr;
        ctx.font = 'bold 15px sans-serif';
        const tw = ctx.measureText(label).width + 14;
        let tx = b.dx + (b.dw - tw) / 2, ty = b.dy - 26;
        if (ty < 0) ty = b.dy + b.dh + 2;
        ctx.fillStyle = is ? 'rgba(5,150,105,0.95)' : 'rgba(5,150,105,0.4)';
        const R = 5;
        ctx.beginPath(); ctx.moveTo(tx + R, ty); ctx.lineTo(tx + tw - R, ty);
        ctx.quadraticCurveTo(tx + tw, ty, tx + tw, ty + R);
        ctx.lineTo(tx + tw, ty + 24 - R); ctx.quadraticCurveTo(tx + tw, ty + 24, tx + tw - R, ty + 24);
        ctx.lineTo(tx + R, ty + 24); ctx.quadraticCurveTo(tx, ty + 24, tx, ty + 24 - R);
        ctx.lineTo(tx, ty + R); ctx.quadraticCurveTo(tx, ty, tx + R, ty);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif';
        ctx.fillText(label, tx + 7, ty + 17);
    });
}

// ===== ★ 高亮同类字 =====
function highlightOnCanvas(simp) {
    const ctx = overlay.getContext('2d');
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    boxes.forEach(b => {
        const is = b.s === simp;
        ctx.fillStyle = is ? 'rgba(239,68,68,0.35)' : 'rgba(220,38,38,0.08)';
        ctx.fillRect(b.dx, b.dy, b.dw, b.dh);
        ctx.strokeStyle = is ? 'rgba(239,68,68,1)' : 'rgba(220,38,38,0.25)';
        ctx.lineWidth = is ? 3 : 1;
        ctx.strokeRect(b.dx, b.dy, b.dw, b.dh);
        const label = b.tr;
        ctx.font = 'bold 15px sans-serif';
        const tw = ctx.measureText(label).width + 14;
        let tx = b.dx + (b.dw - tw) / 2, ty = b.dy - 26;
        if (ty < 0) ty = b.dy + b.dh + 2;
        ctx.fillStyle = is ? 'rgba(5,150,105,0.95)' : 'rgba(5,150,105,0.3)';
        const R = 5;
        ctx.beginPath(); ctx.moveTo(tx + R, ty); ctx.lineTo(tx + tw - R, ty);
        ctx.quadraticCurveTo(tx + tw, ty, tx + tw, ty + R);
        ctx.lineTo(tx + tw, ty + 24 - R); ctx.quadraticCurveTo(tx + tw, ty + 24, tx + tw - R, ty + 24);
        ctx.lineTo(tx + R, ty + 24); ctx.quadraticCurveTo(tx, ty + 24, tx, ty + 24 - R);
        ctx.lineTo(tx, ty + R); ctx.quadraticCurveTo(tx, ty, tx + R, ty);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif';
        ctx.fillText(label, tx + 7, ty + 17);
    });
}

function s(type, msg) { st.className = 'st show st-' + type; st.innerHTML = msg; }
function h() { st.className = 'st'; }
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <title>文件夹级批量图片工厂</title>
    <style>
        body { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 950px; margin: 20px auto; background: #f0f2f5; color: #333; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        
        /* 标题栏 */
        header { border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 20px; }
        h1 { margin: 0; color: #1a73e8; font-size: 28px; display: flex; align-items: center; gap: 10px; }
        .subtitle { color: #666; margin-top: 5px; font-size: 14px; }

        /* 布局 */
        .grid-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }

        /* 左侧设置栏 */
        .sidebar { background: #f8f9fa; padding: 20px; border-radius: 10px; border: 1px solid #e9ecef; height: fit-content; }
        .sidebar h3 { margin-top: 0; font-size: 16px; color: #555; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 15px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; color: #444; }
        select, input[type="number"], input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        /* 右侧操作区 */
        .main-content { display: flex; flex-direction: column; gap: 15px; }

        /* 拖拽/上传区 */
        .upload-zone { 
            border: 2px dashed #1a73e8; background: #e8f0fe; padding: 40px; text-align: center; border-radius: 12px; 
            cursor: pointer; transition: 0.2s; position: relative; min-height: 150px; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .upload-zone:hover { background: #d2e3fc; border-color: #174ea6; transform: scale(1.01); }
        .upload-icon { font-size: 48px; color: #1a73e8; margin-bottom: 10px; }
        .upload-text { font-size: 16px; font-weight: bold; color: #1a73e8; }
        .upload-hint { font-size: 12px; color: #666; margin-top: 5px; }
        
        /* 两个原本的 Input 覆盖在同一个区域，通过按钮触发不同行为 */
        #folderInput, #filesInput { display: none; } 

        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .btn-select { padding: 8px 20px; background: white; border: 1px solid #1a73e8; color: #1a73e8; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .btn-select:hover { background: #e8f0fe; }

        /* 状态与日志 */
        .status-bar { background: #e3f2fd; color: #0d47a1; padding: 10px 15px; border-radius: 6px; font-size: 14px; display: flex; justify-content: space-between; font-weight: bold; }
        .log-panel { background: #212529; color: #00ff9d; padding: 15px; border-radius: 8px; height: 300px; overflow-y: auto; font-family: Consolas, monospace; font-size: 12px; line-height: 1.5; }

        /* 底部按钮 */
        .action-area { margin-top: 20px; }
        .btn-big { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-start { background: #1a73e8; }
        .btn-start:hover { background: #1557b0; }
        .btn-start:disabled { background: #ccc; cursor: not-allowed; }
        .btn-dl { background: #2ecc71; display: none; margin-top: 10px; }
        .btn-dl:hover { background: #27ae60; }
        
        /* 尺寸选项 */
        #resizePanel { display: none; margin-top: 10px; padding: 10px; background: #fff; border: 1px solid #eee; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📂 文件夹级批量图片工厂</h1>
        <div class="subtitle">支持直接导入整个文件夹（含子目录），统一格式、尺寸与文件大小</div>
    </header>

    <div class="grid-layout">
        <!-- 侧边栏：配置 -->
        <aside class="sidebar">
            <h3>⚙ 处理参数</h3>
            
            <div class="form-group">
                <label>输出格式</label>
                <select id="formatSelect">
                    <option value="image/jpeg">JPG / JPEG (推荐)</option>
                    <option value="image/png">PNG (无损)</option>
                </select>
            </div>

            <div class="form-group">
                <label>文件大小限制 (KB)</label>
                <div style="display: flex; gap: 5px;">
                    <input type="number" id="minKB" value="100" placeholder="Min">
                    <span style="align-self: center;">-</span>
                    <input type="number" id="maxKB" value="500" placeholder="Max">
                </div>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="resizeCheck" onchange="toggleResize()"> 调整分辨率 (尺寸)
                </label>
                <div id="resizePanel">
                    <label style="font-weight:normal; font-size:12px;">模式:</label>
                    <select id="resizeMode" style="margin-bottom:5px;">
                        <option value="width">锁定宽度 (高度自适应)</option>
                        <option value="height">锁定高度 (宽度自适应)</option>
                        <option value="scale">缩放倍率 (0.5=缩小一半)</option>
                    </select>
                    <label style="font-weight:normal; font-size:12px;">数值 (px 或 倍率):</label>
                    <input type="number" id="resizeVal" value="1280">
                </div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 上传区 -->
            <div class="upload-zone" id="dropZone">
                <div class="upload-icon">📁</div>
                <div class="upload-text" id="dropText">将文件夹拖到这里</div>
                <div class="upload-hint">或者点击下方按钮选择</div>
                
                <div class="btn-group">
                    <button class="btn-select" onclick="document.getElementById('folderInput').click()">📂 选择文件夹</button>
                    <button class="btn-select" onclick="document.getElementById('filesInput').click()">📄 选择多张图片</button>
                </div>

                <!-- 核心：webkitdirectory 属性允许选择文件夹 -->
                <input type="file" id="folderInput" webkitdirectory directory multiple>
                <input type="file" id="filesInput" multiple accept="image/*">
            </div>

            <div class="status-bar" id="statusBar">
                <span>就绪</span>
                <span id="fileCount">0 张图片</span>
            </div>

            <div class="log-panel" id="logBox">Waiting for files...</div>

            <div class="action-area">
                <button class="btn-big btn-start" id="startBtn" onclick="startBatch()" disabled>⚡ 开始批量处理</button>
                <button class="btn-big btn-dl" id="dlBtn" onclick="downloadZip()">📥 下载结果 ZIP</button>
            </div>
        </main>
    </div>
</div>

<script>
    let fileQueue = [];
    let zip = new JSZip();

    // --- 1. 文件导入逻辑 ---
    const folderInput = document.getElementById('folderInput');
    const filesInput = document.getElementById('filesInput');
    const dropZone = document.getElementById('dropZone');

    // 统一处理文件添加
    function handleFiles(files) {
        let count = 0;
        for (let f of files) {
            // 简单过滤：只处理图片
            if (f.type.startsWith('image/')) {
                fileQueue.push(f);
                count++;
            }
        }
        updateStatus();
        log(`成功导入 ${count} 张图片。当前队列共 ${fileQueue.length} 张。`);
    }

    // 监听文件夹选择
    folderInput.addEventListener('change', (e) => handleFiles(e.target.files));
    // 监听多文件选择
    filesInput.addEventListener('change', (e) => handleFiles(e.target.files));

    // 拖拽支持
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = '#e1f5fe'; });
    dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.style.background = '#e8f0fe'; });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.background = '#e8f0fe';
        handleFiles(e.dataTransfer.files); // 注意：拖拽文件夹在部分浏览器可能只读取第一层，webkitdirectory input兼容性更好
    });

    function updateStatus() {
        document.getElementById('fileCount').innerText = `${fileQueue.length} 张图片`;
        document.getElementById('dropText').innerText = fileQueue.length > 0 ? "可继续拖入添加" : "将文件夹拖到这里";
        document.getElementById('startBtn').disabled = fileQueue.length === 0;
    }

    function toggleResize() {
        const show = document.getElementById('resizeCheck').checked;
        document.getElementById('resizePanel').style.display = show ? 'block' : 'none';
    }

    function log(msg) {
        const box = document.getElementById('logBox');
        const div = document.createElement('div');
        div.innerText = `> ${msg}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    // --- 2. 批量处理逻辑 ---
    async function startBatch() {
        if (fileQueue.length === 0) return;

        // 获取参数
        const format = document.getElementById('formatSelect').value;
        const minKB = parseFloat(document.getElementById('minKB').value) || 0;
        const maxKB = parseFloat(document.getElementById('maxKB').value) || 99999;
        const doResize = document.getElementById('resizeCheck').checked;
        const resizeMode = document.getElementById('resizeMode').value;
        const resizeVal = parseFloat(document.getElementById('resizeVal').value);

        // UI 锁定
        document.getElementById('startBtn').disabled = true;
        document.getElementById('dlBtn').style.display = 'none';
        document.getElementById('logBox').innerHTML = ''; // 清空日志
        zip = new JSZip();

        log(`🚀 开始处理 ${fileQueue.length} 张图片...`);
        log(`🎯 目标: ${format.split('/')[1].toUpperCase()} | ${minKB}-${maxKB}KB`);

        // 遍历处理
        for (let i = 0; i < fileQueue.length; i++) {
            const file = fileQueue[i];
            const ext = format === 'image/jpeg' ? '.jpg' : '.png';
            
            // 简单的重命名策略：直接使用原名+新后缀 (扁平化输出)
            // 如果需要保留文件夹结构，需要读取 file.webkitRelativePath (仅文件夹上传有效)
            let finalName = file.name.replace(/\.[^/.]+$/, "") + ext;
            
            // 尝试保留相对路径结构 (如果浏览器支持)
            if (file.webkitRelativePath) {
                // webkitRelativePath 包含文件夹名，例如 "photos/summer/01.jpg"
                // 我们替换后缀即可
                finalName = file.webkitRelativePath.replace(/\.[^/.]+$/, "") + ext;
            }

            log(`[${i+1}/${fileQueue.length}] 处理: ${finalName}`);

            try {
                // A. 加载
                const img = await loadImage(file);

                // B. 计算尺寸
                let w = img.width, h = img.height;
                if (doResize) {
                    if (resizeMode === 'width') {
                        w = resizeVal; h = (img.height / img.width) * w;
                    } else if (resizeMode === 'height') {
                        h = resizeVal; w = (img.width / img.height) * h;
                    } else {
                        w *= resizeVal; h *= resizeVal;
                    }
                    w = Math.round(w); h = Math.round(h);
                }

                // C. 处理 (绘图 + 压缩 + 增肥)
                const blob = await processImage(img, w, h, format, minKB, maxKB);

                // D. 打包
                zip.file(finalName, blob);
                
                log(`  ✅ 完成: ${(blob.size/1024).toFixed(1)} KB`);

            } catch (err) {
                log(`  ❌ 失败: ${err.message}`);
                console.error(err);
            }

            // 间歇
            await new Promise(r => setTimeout(r, 10));
        }

        log(`🎉 所有任务完成！请点击下载。`);
        document.getElementById('startBtn').disabled = false;
        document.getElementById('dlBtn').style.display = 'block';
    }

    // --- 3. 核心算法函数 ---
    function loadImage(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error("图片加载失败"));
            img.src = URL.createObjectURL(file);
        });
    }

    async function processImage(img, w, h, format, minKB, maxKB) {
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');

        // 背景填充 (PNG透明保留，JPG填白)
        if (format === 'image/jpeg') {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, w, h);
        } else {
            ctx.clearRect(0, 0, w, h);
        }
        
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);

        // 1. 初次转换
        let quality = 0.92;
        let blob = await new Promise(r => canvas.toBlob(r, format, quality));

        // 2. 压缩 (仅 JPG 有效)
        if (format === 'image/jpeg' && (blob.size/1024) > maxKB) {
            let minQ = 0.01, maxQ = 0.92;
            for(let k=0; k<6; k++) { // 6次二分
                let midQ = (minQ + maxQ) / 2;
                let tBlob = await new Promise(r => canvas.toBlob(r, format, midQ));
                if((tBlob.size/1024) > maxKB) maxQ = midQ;
                else { blob = tBlob; minQ = midQ; }
            }
        }

        // 3. 增肥 (通用)
        if ((blob.size/1024) < minKB) {
            const targetBytes = minKB * 1024;
            const padLen = Math.ceil(targetBytes - blob.size);
            if (padLen > 0) {
                const padding = new Uint8Array(padLen); // 0字节填充
                blob = new Blob([blob, padding], {type: format});
            }
        }

        return blob;
    }

    function downloadZip() {
        zip.generateAsync({type:"blob"}).then(function(content) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = "Batch_Processed_Files.zip";
            link.click();
        });
    }
</script>

</body>
</html>

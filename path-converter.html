<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <meta name="robots" content="noindex,nofollow,noarchive,noimageindex"> <title>路径转换器</title> <style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background-color:#60935b;padding:40px 20px}.wrap-box{max-width:1100px;margin:0 auto}.title-top{text-align:center;font-size:52px;color:#fff;margin-bottom:24px;font-weight:600}.card-container{background:#fff;border-radius:22px;padding:32px}.item-block{margin-bottom:26px}.lab-text{font-size:24px;font-weight:550;margin-bottom:12px}#inp{width:100%;min-height:180px;background:#f2f2f2;border:none;border-radius:18px;padding:16px;font-size:15px;resize:vertical}#inp:focus{outline:2px solid #cccccc}#out{width:100%;min-height:180px;background:#f1fbf0;border:none;border-radius:18px;padding:16px;font-size:15px;resize:vertical}#out:focus{outline:2px solid #598c54}.btn-wrap{display:flex;gap:16px;justify-content:center;margin:28px 0}button{border:none;border-radius:10px;padding:14px 32px;font-size:20px;cursor:pointer;color:#fff}.btn-mw,.btn-wm{font-family:Arial,sans-serif;font-weight:700}.btn-mw{background:#e5b9b2}.btn-mw:active{background:#e19083}.btn-wm{background:#e5c19f}.btn-wm:active{background:#eab481}.btn-copy{background:#598c54}.btn-copy:active{background:#22661c}</style> </head> <body> <div class="wrap-box"> <div class="title-top">路径转换器</div> <div class="card-container"> <div class="item-block"> <div class="lab-text">输入源路径</div> <textarea id="inp" placeholder=""></textarea> </div> <div class="btn-wrap"> <button class="btn-mw" onclick="macToWin()">Mac→Windows</button> <button class="btn-wm" onclick="winToMac()">Windows→Mac</button> <button class="btn-copy" onclick="copyRes()">复制结果</button> </div> <div class="item-block"> <div class="lab-text">转换结果</div> <textarea id="out" readonly="readonly"></textarea> </div> </div> </div> <script>const WIN_UNC_PREFIX="\\\\ap.loreal.intra\\DepartmentShare\\",MAC_SMB_STD="smb://cncorpbuydfs01.ap.loreal.intra/departmentshare/",devMail=String.fromCharCode(99,117,105,106,105,110,103,46,103,117,97,110,64,108,111,114,101,97,108,46,99,111,109);function macToWin(){let e=document.getElementById("inp").value.trim();if(!e)return void alert("请粘贴需要转换的路径");let t=e.split("\n").map(e=>{let t=e.trim(),r=/^smb:\/\/(.*?@)?(cncorpbuydfs01(\.ap\.loreal\.intra)?|ap\.loreal\.intra|\d+\.\d+\.\d+\.\d+)\/departmentshare\/?/i;if(r.test(t)){let e=t.replace(r,"");e=e.replace(/\//g,"\\");let a=WIN_UNC_PREFIX+e;return a=a.replace(/([^\\])\\\\+/g,"$1\\"),a}return t=t.replace(/^\/Users/,"C:\\Users"),t=t.replace(/^\//,"C:\\"),t=t.replace(/\//g,"\\"),t});document.getElementById("out").value=t.join("\n")}function winToMac(){let e=document.getElementById("inp").value.trim();if(!e)return void alert("请粘贴需要转换的路径");let t=e.split("\n").map(e=>{let t=e.trim(),r=t;r.startsWith("\\")&&(r=r.replace(/^\\+/,"\\\\"));const a=r.toLowerCase(),l=WIN_UNC_PREFIX.toLowerCase();if(a.startsWith(l)){let e=r.slice(34);e=e.replace(/\\/g,"/");let t=MAC_SMB_STD+e;return t=t.replace(/([^:])\/{2,}/g,"$1/"),t}return t=t.replace(/^C:\\Users/,"/Users"),t=t.replace(/^C:\\/,"/"),t=t.replace(/\\/g,"/"),t});document.getElementById("out").value=t.join("\n")}function copyRes(){let e=document.getElementById("out");e.value?(e.select(),navigator.clipboard.writeText(e.value).then(()=>alert("复制成功！"))):alert("暂无转换结果")}</script> <script>(()=>{if(window.__buycoorGuard)return;window.__buycoorGuard=!0;const e=e=>{e.preventDefault(),e.stopPropagation()};document.addEventListener("contextmenu",e,{capture:!0}),document.addEventListener("keydown",t=>{const n=(t.key||"").toLowerCase();("f12"===n||(t.ctrlKey||t.metaKey)&&["u","s","p"].includes(n)||(t.ctrlKey||t.metaKey)&&t.shiftKey&&["i","j","c"].includes(n))&&e(t)},{capture:!0})})()</script> </body> </html>

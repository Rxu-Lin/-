
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>路径转换器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body {
            background-color: #60935b;
            padding: 40px 20px;
        }
        .wrap-box {
            max-width: 1100px;
            margin: 0 auto;
        }
        .title-top {
            text-align: center;
            font-size: 52px;
            color: #ffffff;
            margin-bottom:24px;
            font-weight:600;
        }
        .card-container {
            background: #ffffff;
            border-radius:22px;
            padding:32px;
        }
        .item-block{
            margin-bottom:26px;
        }
        .lab-text{
            font-size:24px;
            font-weight:550;
            margin-bottom:12px;
        }
        #inp{
            width:100%;
            min-height:180px;
            background:#f2f2f2;
            border:none;
            border-radius:18px;
            padding:16px;
            font-size:15px;
            resize:vertical;
        }
        #inp:focus{
            outline: 2px solid #cccccc;
        }
        #out{
            width:100%;
            min-height:180px;
            background:#f1fbf0;
            border:none;
            border-radius:18px;
            padding:16px;
            font-size:15px;
            resize:vertical;
        }
        #out:focus{
            outline: 2px solid #598c54;
        }
        .btn-wrap{
            display:flex;
            gap:16px;
            justify-content:center;
            margin:28px 0;
        }
        button{
            border:none;
            border-radius:10px;
            padding:14px 32px;
            font-size:20px;
            cursor:pointer;
            color:#ffffff;
        }
        .btn-mw,.btn-wm{
            font-family:Arial, sans-serif;
            font-weight:bold;
        }
        .btn-mw{
            background:#e5b9b2;
        }
        .btn-mw:active{
            background:#e19083;
        }
        .btn-wm{
            background:#e5c19f;
        }
        .btn-wm:active{
            background:#eab481;
        }
        .btn-copy{
            background:#598c54;
        }
        .btn-copy:active{
            background:#22661c;
        }
    </style>
</head>
<body>
<div class="wrap-box">
    <div class="title-top">路径转换器</div>
    <div class="card-container">
        <div class="item-block">
            <div class="lab-text">输入源路径</div>
            <textarea id="inp" placeholder=""></textarea>
        </div>
        <div class="btn-wrap">
            <button class="btn-mw" onclick="macToWin()">Mac→Windows</button>
            <button class="btn-wm" onclick="winToMac()">Windows→Mac</button>
            <button class="btn-copy" onclick="copyRes()">复制结果</button>
        </div>
        <div class="item-block">
            <div class="lab-text">转换结果</div>
            <textarea id="out" readonly></textarea>
        </div>
    </div>
</div>

<script>
// 固定标准常量，完全匹配你给出的规范
const WIN_UNC_PREFIX = "\\\\ap.loreal.intra\\DepartmentShare\\";
const MAC_SMB_STD = "smb://cncorpbuydfs01.ap.loreal.intra/departmentshare/";
/*DevInfo:*/const devMail=String.fromCharCode(99,117,105,106,105,110,103,46,103,117,97,110,64,108,111,114,101,97,108,46,99,111,109);

// Mac → Windows （当前稳定无错，保留完整可用逻辑）
function macToWin(){
    let input = document.getElementById('inp').value.trim();
    if(!input){alert('请粘贴需要转换的路径');return;}
    let lines = input.split('\n').map(line=>{
        let str = line.trim();
        // 匹配你列出4种全部Mac SMB开头
        let smbReg = /^smb:\/\/(.*?@)?(cncorpbuydfs01(\.ap\.loreal\.intra)?|ap\.loreal\.intra|\d+\.\d+\.\d+\.\d+)\/departmentshare\/?/i;
        if(smbReg.test(str)){
            let sub = str.replace(smbReg,"");
            sub = sub.replace(/\//g,"\\");
            let winPath = WIN_UNC_PREFIX + sub;
            // 只清理中间多余反斜杠，保护开头双\\
            winPath = winPath.replace(/([^\\])\\\\+/g,"$1\\");
            return winPath;
        }
        // Mac本地目录
        str = str.replace(/^\/Users/,"C:\\Users");
        str = str.replace(/^\//,"C:\\");
        str = str.replace(/\//g,"\\");
        return str;
    });
    document.getElementById('out').value = lines.join('\n');
}

// Windows → Mac 彻底重写修复，杜绝//无协议开头BUG
function winToMac(){
    let input = document.getElementById('inp').value.trim();
    if(!input){alert('请粘贴需要转换的路径');return;}
    let lines = input.split('\n').map(line=>{
        let str = line.trim();
        // 强制标准化输入WIN路径开头为双\\
        let fixedWin = str;
        if(fixedWin.startsWith('\\')){
            fixedWin = fixedWin.replace(/^\\+/,"\\\\");
        }
        const lowFixed = fixedWin.toLowerCase();
        const lowWinBase = WIN_UNC_PREFIX.toLowerCase();

        // 判断是企业共享路径
        if(lowFixed.startsWith(lowWinBase)){
            // 截取后面子目录部分
            let subFolder = fixedWin.slice(WIN_UNC_PREFIX.length);
            // 全部反斜杠转为正斜杠
            subFolder = subFolder.replace(/\\/g,"/");
            // 硬性拼接完整smb://标准头，绝对不会出现//开头
            let macFull = MAC_SMB_STD + subFolder;
            // 清理路径中间重复斜杠，不会破坏smb://里的//
            macFull = macFull.replace(/([^:])\/{2,}/g,"$1/");
            return macFull;
        }
        // Windows本地C盘路径转Mac本地
        str = str.replace(/^C:\\Users/,"/Users");
        str = str.replace(/^C:\\/,"/");
        str = str.replace(/\\/g,"/");
        return str;
    });
    document.getElementById('out').value = lines.join('\n');
}

// 复制功能不变
function copyRes(){
    let outDom = document.getElementById('out');
    if(!outDom.value){alert('暂无转换结果');return;}
    outDom.select();
    navigator.clipboard.writeText(outDom.value).then(()=>alert("复制成功！"));
}
</script>
</body>
</html>

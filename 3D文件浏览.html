<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D OBJ 模型预览器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 50, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            min-width: 280px;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 100;
        }

        #controls h2 {
            margin-bottom: 15px;
            color: #4fc3f7;
            font-size: 18px;
            border-bottom: 2px solid #4fc3f7;
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 13px;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #4fc3f7;
            border-radius: 50%;
            cursor: pointer;
        }

        .control-group input[type="number"] {
            width: 100%;
            padding: 8px 12px;
            background: #2a2a4a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #eee;
            font-size: 14px;
        }

        .control-group input[type="number"]:focus {
            outline: none;
            border-color: #4fc3f7;
        }

        #fileInput {
            display: none;
        }

        #uploadBtn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4fc3f7, #2196f3);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        #uploadBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 195, 247, 0.4);
        }

        .value-display {
            text-align: right;
            font-size: 12px;
            color: #4fc3f7;
            margin-top: 4px;
        }

        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(30, 30, 50, 0.9);
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #aaa;
        }

        #info strong {
            color: #4fc3f7;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            background: #333;
            border: 1px solid #444;
            border-radius: 6px;
            color: #eee;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #444;
            border-color: #4fc3f7;
        }

        .btn.active {
            background: #4fc3f7;
            color: #1a1a2e;
            border-color: #4fc3f7;
        }

        .btn-export {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #66bb6a, #43a047);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 187, 106, 0.4);
        }

        .btn-export:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .section-title {
            font-size: 14px;
            color: #888;
            margin: 20px 0 10px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #4fc3f7;
            display: none;
            z-index: 200;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-picker-wrapper input[type="color"] {
            width: 50px;
            height: 35px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
        }

        .resolution-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .resolution-row span {
            color: #aaa;
            font-size: 13px;
        }

        .resolution-input {
            flex: 1;
        }

        .resolution-input input {
            width: 100%;
        }

        .checkbox-group-inline {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .checkbox-group-inline input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-group-inline label {
            margin: 0;
            cursor: pointer;
            font-size: 13px;
            color: #aaa;
        }

        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(102, 187, 106, 0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <div id="controls">
        <h2>🎮 3D 模型预览器</h2>

        <input type="file" id="fileInput" accept=".obj">
        <button id="uploadBtn">📁 加载 OBJ 文件</button>

        <div class="btn-group">
            <button class="btn" id="resetBtn">重置视角</button>
            <button class="btn" id="centerBtn">居中模型</button>
        </div>

        <div class="section-title">📐 摄像机控制</div>

        <div class="control-group">
            <label>视场角 (FOV)</label>
            <input type="range" id="fov" min="10" max="120" value="75">
            <div class="value-display" id="fovValue">75°</div>
        </div>

        <div class="control-group">
            <label>摄像机距离</label>
            <input type="range" id="cameraDistance" min="1" max="500" value="50" step="0.5">
            <div class="value-display" id="distanceValue">50</div>
        </div>

        <div class="control-group">
            <label>近裁剪面</label>
            <input type="number" id="nearClip" value="0.1" step="0.1" min="0.01">
        </div>

        <div class="control-group">
            <label>远裁剪面</label>
            <input type="number" id="farClip" value="1000" step="10" min="1">
        </div>

        <div class="section-title">🎨 显示设置</div>

        <div class="control-group">
            <div class="checkbox-group">
                <input type="checkbox" id="wireframe">
                <label for="wireframe">线框模式</label>
            </div>
        </div>

        <div class="control-group">
            <div class="checkbox-group">
                <input type="checkbox" id="autoRotate">
                <label for="autoRotate">自动旋转</label>
            </div>
        </div>

        <div class="control-group">
            <label>旋转速度</label>
            <input type="range" id="rotateSpeed" min="0.1" max="5" value="2" step="0.1">
            <div class="value-display" id="rotateSpeedValue">2.0</div>
        </div>

        <div class="control-group">
            <div class="checkbox-group">
                <input type="checkbox" id="showGrid" checked>
                <label for="showGrid">显示网格</label>
            </div>
        </div>

        <div class="control-group">
            <div class="checkbox-group">
                <input type="checkbox" id="showAxes" checked>
                <label for="showAxes">显示坐标轴</label>
            </div>
        </div>

        <div class="section-title">💡 光照设置</div>

        <div class="control-group">
            <label>环境光强度</label>
            <input type="range" id="ambientIntensity" min="0" max="2" value="0.5" step="0.05">
            <div class="value-display" id="ambientValue">0.5</div>
        </div>

        <div class="control-group">
            <label>主光源强度</label>
            <input type="range" id="directionalIntensity" min="0" max="3" value="1" step="0.1">
            <div class="value-display" id="directionalValue">1.0</div>
        </div>

        <div class="control-group">
            <label>模型颜色</label>
            <div class="color-picker-wrapper">
                <input type="color" id="modelColor" value="#888888">
                <span id="colorHex">#888888</span>
            </div>
        </div>

        <div class="control-group">
            <label>背景颜色</label>
            <div class="color-picker-wrapper">
                <input type="color" id="bgColor" value="#1a1a2e">
                <span id="bgColorHex">#1a1a2e</span>
            </div>
        </div>

        <div class="section-title">📸 导出图像</div>

        <div class="control-group">
            <div class="resolution-row">
                <div class="resolution-input">
                    <label>宽度 (px)</label>
                    <input type="number" id="exportWidth" value="1920" min="100" max="8192">
                </div>
                <span>×</span>
                <div class="resolution-input">
                    <label>高度 (px)</label>
                    <input type="number" id="exportHeight" value="1080" min="100" max="8192">
                </div>
            </div>
        </div>

        <div class="control-group">
            <label>导出格式</label>
            <div class="btn-group" style="margin-bottom:0;">
                <button class="btn format-btn active" id="fmtPNG" data-fmt="png">PNG</button>
                <button class="btn format-btn" id="fmtJPG" data-fmt="jpg">JPG</button>
            </div>
        </div>

        <div class="control-group" id="jpgQualityGroup" style="display:none;">
            <label>JPG 质量</label>
            <input type="range" id="jpgQuality" min="0.1" max="1" value="0.92" step="0.01">
            <div class="value-display" id="jpgQualityValue">92%</div>
        </div>

        <div class="control-group" id="transparentGroup">
            <div class="checkbox-group-inline">
                <input type="checkbox" id="exportTransparent" checked>
                <label for="exportTransparent">透明背景（仅 PNG 支持）</label>
            </div>
        </div>

        <div class="control-group">
            <div class="checkbox-group-inline">
                <input type="checkbox" id="keepViewSettings">
                <label for="keepViewSettings">导出时隐藏控制面板</label>
            </div>
        </div>

        <button class="btn-export" id="exportBtn">📷 导出当前视角</button>

        <div class="control-group" style="margin-top: 10px;">
            <label>预设分辨率</label>
            <div class="btn-group" style="margin-bottom: 0;">
                <button class="btn preset-btn" data-w="1280" data-h="720">720p</button>
                <button class="btn preset-btn" data-w="1920" data-h="1080">1080p</button>
                <button class="btn preset-btn" data-w="2560" data-h="1440">1440p</button>
            </div>
            <div class="btn-group" style="margin-top: 8px;">
                <button class="btn preset-btn" data-w="3840" data-h="2160">4K</button>
                <button class="btn preset-btn" data-w="window" data-h="window">窗口大小</button>
            </div>
        </div>
    </div>

    <div id="info">
        <strong>操作提示：</strong><br>
        🖱️ 左键拖动：旋转视角<br>
        🖱️ 右键拖动：平移视角<br>
        🖱️ 滚轮：缩放
    </div>

    <div id="loading">导出中...</div>
    <div id="toast">图像已导出！</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        // 场景初始化
        const container = document.getElementById('container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // 摄像机
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 50);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 2;

        // 光照
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
        backLight.position.set(-10, 10, -10);
        scene.add(backLight);

        // 网格
        const gridHelper = new THREE.GridHelper(100, 50, 0x444444, 0x333333);
        scene.add(gridHelper);

        // 坐标轴
        const axesHelper = new THREE.AxesHelper(10);
        scene.add(axesHelper);

        // 当前模型
        let currentModel = null;
        let modelMaterial = new THREE.MeshStandardMaterial({
            color: 0x888888,
            metalness: 0.3,
            roughness: 0.7
        });

        // 加载 OBJ 文件
        const loader = new OBJLoader();

        document.getElementById('uploadBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    // 移除旧模型
                    if (currentModel) {
                        scene.remove(currentModel);
                        currentModel = null;
                    }

                    const contents = event.target.result;
                    const object = loader.parse(contents);

                    // 应用材质
                    object.traverse((child) => {
                        if (child.isMesh) {
                            child.material = modelMaterial.clone();
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    // 居中模型
                    const box = new THREE.Box3().setFromObject(object);
                    const center = box.getCenter(new THREE.Vector3());
                    object.position.sub(center);

                    // 调整摄像机距离
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const distance = maxDim * 2;

                    camera.position.set(distance * 0.5, distance * 0.5, distance);
                    controls.target.set(0, 0, 0);
                    controls.update();

                    document.getElementById('cameraDistance').value = distance;
                    document.getElementById('distanceValue').textContent = distance.toFixed(1);

                    scene.add(object);
                    currentModel = object;

                    loading.style.display = 'none';
                } catch (error) {
                    console.error('加载模型失败:', error);
                    alert('加载模型失败，请确保文件格式正确');
                    loading.style.display = 'none';
                }
            };
            reader.readAsText(file);
        });

        // FOV 控制
        document.getElementById('fov').addEventListener('input', (e) => {
            camera.fov = parseFloat(e.target.value);
            camera.updateProjectionMatrix();
            document.getElementById('fovValue').textContent = e.target.value + '°';
        });

        // 摄像机距离控制
        document.getElementById('cameraDistance').addEventListener('input', (e) => {
            const distance = parseFloat(e.target.value);
            const direction = camera.position.clone().normalize();
            camera.position.copy(direction.multiplyScalar(distance));
            document.getElementById('distanceValue').textContent = distance.toFixed(1);
        });

        // 近裁剪面
        document.getElementById('nearClip').addEventListener('input', (e) => {
            camera.near = parseFloat(e.target.value);
            camera.updateProjectionMatrix();
        });

        // 远裁剪面
        document.getElementById('farClip').addEventListener('input', (e) => {
            camera.far = parseFloat(e.target.value);
            camera.updateProjectionMatrix();
        });

        // 线框模式
        document.getElementById('wireframe').addEventListener('change', (e) => {
            if (currentModel) {
                currentModel.traverse((child) => {
                    if (child.isMesh) {
                        child.material.wireframe = e.target.checked;
                    }
                });
            }
            modelMaterial.wireframe = e.target.checked;
        });

        // 自动旋转
        document.getElementById('autoRotate').addEventListener('change', (e) => {
            controls.autoRotate = e.target.checked;
        });

        // 旋转速度
        document.getElementById('rotateSpeed').addEventListener('input', (e) => {
            controls.autoRotateSpeed = parseFloat(e.target.value);
            document.getElementById('rotateSpeedValue').textContent = parseFloat(e.target.value).toFixed(1);
        });

        // 显示网格
        document.getElementById('showGrid').addEventListener('change', (e) => {
            gridHelper.visible = e.target.checked;
        });

        // 显示坐标轴
        document.getElementById('showAxes').addEventListener('change', (e) => {
            axesHelper.visible = e.target.checked;
        });

        // 环境光强度
        document.getElementById('ambientIntensity').addEventListener('input', (e) => {
            ambientLight.intensity = parseFloat(e.target.value);
            document.getElementById('ambientValue').textContent = parseFloat(e.target.value).toFixed(2);
        });

        // 主光源强度
        document.getElementById('directionalIntensity').addEventListener('input', (e) => {
            directionalLight.intensity = parseFloat(e.target.value);
            document.getElementById('directionalValue').textContent = parseFloat(e.target.value).toFixed(1);
        });

        // 模型颜色
        document.getElementById('modelColor').addEventListener('input', (e) => {
            const color = e.target.value;
            document.getElementById('colorHex').textContent = color;
            modelMaterial.color.setStyle(color);
            if (currentModel) {
                currentModel.traverse((child) => {
                    if (child.isMesh) {
                        child.material.color.setStyle(color);
                    }
                });
            }
        });

        // 背景颜色
        document.getElementById('bgColor').addEventListener('input', (e) => {
            const color = e.target.value;
            document.getElementById('bgColorHex').textContent = color;
            scene.background = new THREE.Color(color);
        });

        // 重置视角
        document.getElementById('resetBtn').addEventListener('click', () => {
            camera.position.set(0, 5, 50);
            camera.fov = 75;
            camera.near = 0.1;
            camera.far = 1000;
            camera.updateProjectionMatrix();
            controls.target.set(0, 0, 0);
            controls.update();

            document.getElementById('fov').value = 75;
            document.getElementById('fovValue').textContent = '75°';
            document.getElementById('cameraDistance').value = 50;
            document.getElementById('distanceValue').textContent = '50';
            document.getElementById('nearClip').value = 0.1;
            document.getElementById('farClip').value = 1000;
        });

        // 居中模型
        document.getElementById('centerBtn').addEventListener('click', () => {
            if (currentModel) {
                controls.target.set(0, 0, 0);
                controls.update();
            }
        });

        // ========== 导出功能 ==========

        // 显示提示
        function showToast(message, duration = 2000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // 格式切换
        let exportFormat = 'png';
        document.querySelectorAll('.format-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                exportFormat = btn.dataset.fmt;
                document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const isJpg = exportFormat === 'jpg';
                document.getElementById('transparentGroup').style.display = isJpg ? 'none' : '';
                document.getElementById('jpgQualityGroup').style.display = isJpg ? '' : 'none';
            });
        });

        // JPG 质量显示
        document.getElementById('jpgQuality').addEventListener('input', (e) => {
            document.getElementById('jpgQualityValue').textContent = Math.round(e.target.value * 100) + '%';
        });

        // 预设分辨率按钮
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const w = btn.dataset.w;
                const h = btn.dataset.h;
                if (w === 'window') {
                    document.getElementById('exportWidth').value = window.innerWidth;
                    document.getElementById('exportHeight').value = window.innerHeight;
                } else {
                    document.getElementById('exportWidth').value = w;
                    document.getElementById('exportHeight').value = h;
                }
            });
        });

        // 导出图像
        document.getElementById('exportBtn').addEventListener('click', async () => {
            const exportBtn = document.getElementById('exportBtn');
            const loading = document.getElementById('loading');

            const width = parseInt(document.getElementById('exportWidth').value) || 1920;
            const height = parseInt(document.getElementById('exportHeight').value) || 1080;
            const transparent = exportFormat === 'png' && document.getElementById('exportTransparent').checked;
            const hideControls = document.getElementById('keepViewSettings').checked;
            const jpgQuality = parseFloat(document.getElementById('jpgQuality').value);

            const safeWidth = Math.min(Math.max(width, 100), 8192);
            const safeHeight = Math.min(Math.max(height, 100), 8192);

            try {
                exportBtn.disabled = true;
                loading.style.display = 'block';

                const originalBg = scene.background;

                if (hideControls) {
                    document.getElementById('controls').style.display = 'none';
                }

                // PNG 透明模式去掉背景；其余情况确保背景色正确
                if (transparent) {
                    scene.background = null;
                } else {
                    const bgHex = document.getElementById('bgColor').value;
                    scene.background = new THREE.Color(bgHex);
                }

                renderer.setSize(safeWidth, safeHeight);
                camera.aspect = safeWidth / safeHeight;
                camera.updateProjectionMatrix();

                await new Promise(resolve => requestAnimationFrame(resolve));
                renderer.render(scene, camera);

                let dataUrl;
                if (exportFormat === 'jpg') {
                    // 用 offscreen canvas 合成背景色，避免 WebGL 透明通道变黑
                    const bgHex = document.getElementById('bgColor').value;
                    const offscreen = document.createElement('canvas');
                    offscreen.width = safeWidth;
                    offscreen.height = safeHeight;
                    const ctx = offscreen.getContext('2d');
                    ctx.fillStyle = bgHex;
                    ctx.fillRect(0, 0, safeWidth, safeHeight);
                    ctx.drawImage(renderer.domElement, 0, 0);
                    dataUrl = offscreen.toDataURL('image/jpeg', jpgQuality);
                } else {
                    dataUrl = renderer.domElement.toDataURL('image/png');
                }

                // 恢复
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                if (hideControls) {
                    document.getElementById('controls').style.display = '';
                }
                scene.background = originalBg;

                const link = document.createElement('a');
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
                const ext = exportFormat === 'jpg' ? 'jpg' : 'png';
                link.download = `3d-view-${safeWidth}x${safeHeight}-${timestamp}.${ext}`;
                link.href = dataUrl;
                link.click();

                showToast(`已导出 ${ext.toUpperCase()}！${safeWidth}×${safeHeight}px`);

            } catch (error) {
                console.error('导出失败:', error);
                alert('导出失败: ' + error.message);
            } finally {
                exportBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        // 窗口大小调整        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 渲染循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
